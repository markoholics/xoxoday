<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loyalife by Xoxoday</title>
    <meta name="description" content="Loyalife by Xoxoday runs customer, channel partner and influencer loyalty programs with approvals, audit trails and rewards in 150+ countries." />
    <meta name="theme-color" content="#0C0A09" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('loyalife_prefs_v1') || '{}');
          var t = p.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', t);
          var rm = p.reduceMotion === true || matchMedia('(prefers-reduced-motion: reduce)').matches;
          document.documentElement.setAttribute('data-reduce-motion', rm ? 'true' : 'false');
        } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
